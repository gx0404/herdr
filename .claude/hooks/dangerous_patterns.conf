# herdr 危险模式唯一真源。被 .claude/hooks/pre_tool_use_gate.py 与
# .codex/hooks/pre_tool_use_policy.py 消费；改模式必须跑
# python3 -m unittest scripts.test_ai_tool_hooks 并演练允许/拒绝探针。
# 列：SECTION<TAB>regex<TAB>理由<TAB>级别（deny|ask，缺省 deny）
# SECTION=SHELL 作用于 Bash command；SECTION=FILE 作用于 Edit/Write file_path。
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*git(?:\s+-{1,2}[\w-]+(?:[= ]\S+)?)*?\s+push\b[^\n;&|]*(\s--force(\s|$)|\s-f(\s|$))	禁止 force push：改写共享历史	deny
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*git(?:\s+-{1,2}[\w-]+(?:[= ]\S+)?)*?\s+push\b[^\n;&|]*\s--force-with-lease\b	force-with-lease 需人工确认	ask
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*git(?:\s+-{1,2}[\w-]+(?:[= ]\S+)?)*?\s+commit\b[^\n]*(\s--no-verify(?=[\s;&|)]|$)|\s-n(?=[\s;&|)]|$))	不得绕过仓库 hooks（conventional commits 守门）	deny
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*git(?:\s+-{1,2}[\w-]+(?:[= ]\S+)?)*?\s+add\b[^\n]*(\s(?:-f|--force)\b)	不得强制添加被忽略文件	deny
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*gh\s+pr\s+merge\b	PR 由人类合并，agent 永不执行（governance.md）	deny
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*gh\s+release\s+(create|edit|delete|upload|delete-asset)\b	发布动作仅限核实维护者（release-channels.md）	deny
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*cargo\s+publish\b	herdr 不经 crates.io 发布	deny
SHELL	>\s*(\./)?(distribution/(latest|preview)\.json|docs/versions/\S*|docs/next/CHANGELOG\.md|CHANGELOG\.md)\b	发布/渠道文件不得手改：走 just release 与 scripts（docs-pipeline.md）	deny
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*(sed|tee|truncate|dd)\b[^\n]*\b(distribution/(latest|preview)\.json|docs/versions/)	发布快照与渠道清单不得手改	deny
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*(cat|cp|head|tail|less|base64)\b[^\n]*((~/\.ssh/|/\.ssh/)|id_rsa|id_ed25519|\.pem\b)	不读取凭据与私钥	deny
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*(?:pkill|killall)\b	不杀不明进程：先确认目标归属	ask
FILE	^distribution/(latest|preview)\.json$	渠道清单由发布工具链生成，不手改（release-channels.md）	deny
FILE	^docs/versions/	已发布版本树由 release CI 播种（docs-pipeline.md）	deny
FILE	^docs/preview/website/	preview 快照由 preview CI 原子提交，严禁手改	deny
FILE	^docs/next/CHANGELOG\.md$	CHANGELOG 在 stable 发布准备期间人工策展，feature 工作不编辑（docs-pipeline.md）	deny
FILE	^CHANGELOG\.md$	根 CHANGELOG 由 scripts/changelog.py 在发布时同步，不手改（release-channels.md）	deny
FILE	^vendor/libghostty-vt/	vendored 上游树不手改：走 scripts/vendor_libghostty_vt.py 与补丁索引（vendored-libghostty-vt.md）	deny
FILE	^\.github/(MAINTAINERS|APPROVED_CONTRIBUTORS)$	治理名单仅仓库所有者维护（governance.md）	deny
FILE	(^|/)\.env(\.|$)	环境秘密不入库不读取	deny
FILE	(^|/)id_(rsa|ed25519)(\.|$)|\.pem$|\.ssh/	凭据与私钥不读取	deny
