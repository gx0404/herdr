# herdr 危险模式唯一真源。被 .claude/hooks/pre_tool_use_gate.py 与
# .codex/hooks/pre_tool_use_policy.py 消费；改模式必须跑
# python3 -m unittest scripts.test_ai_tool_hooks 并演练允许/拒绝探针。
# 列：SECTION<TAB>regex<TAB>理由<TAB>级别（deny|ask，缺省 deny）
# SECTION=SHELL 作用于 Bash command；SECTION=FILE 作用于 Edit/Write file_path。
# 2026-10 用户授权「保留最小核心防线」：仅保留 force push、根/家目录 rm、
# 凭据/私钥读取与写入四类 deny；其余策略、ask 级规则与 Claude 白名单已放开。
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*git(?:\s+-{1,2}[\w-]+(?:[= ]\S+)?)*?\s+push\b[^\n;&|]*(\s--force(?=[\s;&|)]|$)|\s-f(?=[\s;&|)]|$))	禁止 force push：改写共享历史	deny
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*rm\b[^\n;&|]*?-{1,2}[a-zA-Z-]*[rR][a-zA-Z-]*\b[^\n;&|]*?(?:\s|["'`])(?:/(?:\*{0,2})(?:[\s;"'`)&|]|$)|~/?\*{0,2}(?:[\s;"'`)&|]|$)|\$\{?HOME\}?(?:/\*{0,2})?(?:[\s;"'`)&|]|$))	禁止递归删除根目录或家目录	deny
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*(cat|cp|head|tail|less|base64)\b[^\n]*((~/\.ssh/|/\.ssh/)|id_rsa|id_ed25519|\.pem\b)	不读取凭据与私钥	deny
FILE	(^|/)\.env(\.|$)	环境秘密不入库不读取	deny
FILE	(^|/)id_(rsa|ed25519)(\.|$)|\.pem$|\.ssh/	凭据与私钥不读取	deny
