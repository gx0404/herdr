# herdr AI 领域规则路由 —— 唯一机器真源。
# 语义：paths 为排序 glob（* 不跨目录，** 跨目录，`dir/**` 额外匹配目录自身）；
# 多条规则命中同一文件时取并集（有意为之，注释说明原因）；tasks 触发任务级规则。
# 闭集约束：每个 Git 可见文件必须命中至少一条规则或 root_only；root_only 当前为空。
# 维护流程见 docs/AGENT_RULES/README.md。

version = 2
root_max_bytes = 16384
root_only = []

[[rules]]
id = "ai-tooling"
doc = "docs/AGENT_RULES/ai-tooling.md"
paths = [
  ".agents/**",
  ".claude/**",
  ".codex/**",
  ".pi/**",
  ".zcode/**",
  ".zed/**",
  "AGENTS.md",
  "CLAUDE.md",
  "docs/AGENT_RULES/**",
  "docs/AI_TOOLS.md",
  "docs/graphify/**",
  "docs/kb/**",
  "graphify-out/**",
  "scripts/agent_kb.py",
  "scripts/build_agent_kb.py",
  "scripts/graphify.sh",
  "scripts/graphify_fingerprint.py",
  "scripts/resolve_agent_rules.py",
  "scripts/test_agent_kb.py",
  "scripts/test_ai_tool_hooks.py",
  "scripts/test_resolve_agent_rules.py",
  "src/.graphifyignore",
]
tasks = []

[[rules]]
id = "app-render"
doc = "docs/AGENT_RULES/app-render.md"
paths = [
  "scripts/test_ui_hot_path_architecture.py",
  "src/agent_view_eval.rs",
  "src/app/**",
  "src/copy_mode.rs",
  "src/layout.rs",
  "src/pane.rs",
  "src/pane/**",
  "src/popup_size.rs",
  "src/selection.rs",
  "src/terminal_effects.rs",
  "src/terminal_theme.rs",
  "src/ui.rs",
  "src/ui/**",
]
tasks = []

[[rules]]
id = "code-review"
doc = "docs/AGENT_RULES/code-review.md"
paths = []
tasks = ["review"]

[[rules]]
id = "detection"
doc = "docs/AGENT_RULES/detection.md"
paths = [
  "distribution/agent-detection/**",
  "scripts/agent_detection_manifest_check.py",
  "scripts/capture_agent_screen.py",
  "scripts/test_agent_detection_manifest_check.py",
  # 上游同步丢弃清单同时覆盖检测 manifest 与集成资产，与 integration-assets 取并集。
  "scripts/test_upstream_sync_drop_check.py",
  "scripts/upstream_sync_drop_check.py",
  "scripts/upstream_sync_drop_paths.txt",
  "src/detect/**",
  # 检测的运行时消费点与领域实现共用不变量，取并集。
  "src/pane/agent_detection.rs",
  "src/server/autodetect.rs",
  "tests/auto_detect.rs",
]
tasks = []

[[rules]]
id = "docs-pipeline"
doc = "docs/AGENT_RULES/docs-pipeline.md"
paths = [
  "README.md",
  "README.zh-CN.md",
  "docs/**",
  "scripts/config_reference_check.py",
  "scripts/docs/**",
  "scripts/docs_translation_parity.py",
  "scripts/test_config_reference_check.py",
  "scripts/test_docs_translation_parity.py",
]
tasks = []

[[rules]]
id = "governance"
doc = "docs/AGENT_RULES/governance.md"
paths = [
  ".githooks/**",
  ".github/**",
  "CONTRIBUTING.md",
  "LICENSE",
  "SPONSORS.md",
  "scripts/conventional_commits.py",
]
tasks = []

[[rules]]
id = "integration-assets"
doc = "docs/AGENT_RULES/integration-assets.md"
paths = [
  # 上游同步丢弃清单（六家以外的集成），与 detection 取并集。
  "scripts/test_upstream_sync_drop_check.py",
  "scripts/upstream_sync_drop_check.py",
  "scripts/upstream_sync_drop_paths.txt",
  "src/integration/**",
]
tasks = []

[[rules]]
id = "persistence-session"
doc = "docs/AGENT_RULES/persistence-session.md"
paths = [
  "src/agent_resume.rs",
  "src/persist.rs",
  "src/persist/**",
  "src/session.rs",
  "src/workspace.rs",
  "src/workspace/**",
  "src/worktree.rs",
  "tests/live_handoff.rs",
]
tasks = []

[[rules]]
id = "platform"
doc = "docs/AGENT_RULES/platform.md"
paths = [
  "scripts/package_windows_conpty.ps1",
  "scripts/package_windows_conpty.py",
  "scripts/test_package_windows_conpty.py",
  "scripts/test_windows_cross.py",
  # 本机交互式 Windows 输入资格测试（`just test-windows-input`，普通 CI 不跑）。
  "scripts/test_windows_input.ps1",
  "scripts/test_windows_input.py",
  "scripts/windows_arm64_installer_test.ps1",
  "scripts/windows_check.ps1",
  "scripts/windows_conpty_enhanced_input_probe.ps1",
  "scripts/windows_cross.py",
  "scripts/windows_input/**",
  "scripts/windows_install_conpty_package_test.ps1",
  "scripts/windows_smoke_conpty_path.ps1",
  "scripts/windows_tui_compat.ps1",
  # Windows 专属实现同时受平台隔离与所属领域约束，取并集。
  "src/client/input/windows_vti.rs",
  "src/pane/terminal/windows_recent_fallback.rs",
  "src/platform/**",
]
tasks = []

[[rules]]
id = "product-agent-skill"
doc = "docs/AGENT_RULES/product-agent-skill.md"
paths = [
  "distribution/agent-guide.md",
