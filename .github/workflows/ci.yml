name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [feature/gx_herdr]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1
  # Keep file/line backtraces without generating type and variable debug information.
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  # Persist both Zig caches; build outputs otherwise stay uncached in Cargo's OUT_DIR.
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  # PR caches are visible only to their own PR, and every save pushes the
  # repository toward GitHub's cache limit, evicting the master caches PRs
  # restore from. Only branch pushes save.
  SAVE_CACHES: ${{ github.event_name == 'push' }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate commit subjects
        if: github.event_name == 'push'
        run: python3 scripts/conventional_commits.py --range "${{ github.event.before }}..${{ github.event.after }}"

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/conventional_commits.py "$PR_TITLE"

  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: unix
            nextest_filter: all()
            timeout_minutes: 15
          # Caches are saved only by a green push, so macOS and Windows run their
          # full checks cold until one succeeds; Windows also adds the ConPTY
          # smoke and cache uploads. Neither fits in 15 minutes cold.
          - os: macos-latest
            kind: unix
            nextest_filter: not binary(live_handoff)
            timeout_minutes: 25
          - os: windows-latest
            kind: windows
            timeout_minutes: 25
    runs-on: ${{ matrix.os }}
    # Qualification adds up to 30m native release, 8 x 60s sampling plus 12m
    # startup/download/handoff headroom to the existing 15/25m check budget.
    timeout-minutes: ${{ github.repository == 'gx0404/herdr' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'gx0404/herdr' && github.head_ref == 'verify/runtime-sync-p11-20261006' && 75 || matrix.timeout_minutes }}
    env:
      RELEASE_QUALIFICATION: ${{ github.repository == 'gx0404/herdr' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'gx0404/herdr' && github.head_ref == 'verify/runtime-sync-p11-20261006' }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        if: matrix.kind == 'unix'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt,clippy

      - name: Install Rust
        if: matrix.kind == 'windows'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt,clippy
          targets: x86_64-pc-windows-msvc

      - name: Install Rust tools
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: just,cargo-nextest

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # Zig downloads come from ziglang.org or a random community mirror and
      # vary from seconds to minutes; reuse the verified install instead.
      - name: Restore Zig compiler
        id: zig-compiler
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/herdr-zig-0.16.0
          key: zig-compiler-v1-${{ runner.os }}-${{ runner.arch }}-0.16.0

      - name: Install Zig
        if: steps.zig-compiler.outputs.cache-hit != 'true'
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      # Zig's C-header cache keys include the compiler installation path.
      - name: Stabilize Zig installation path on Unix
        if: matrix.kind == 'unix'
        env:
          ZIG_RESTORED: ${{ steps.zig-compiler.outputs.cache-hit }}
        run: |
          stable_zig="$RUNNER_TEMP/herdr-zig-0.16.0"
          if [ "$ZIG_RESTORED" != "true" ]; then
            mv "$(dirname "$(command -v zig)")" "$stable_zig"
          fi
          echo "$stable_zig" >> "$GITHUB_PATH"
          echo "ZIG=$stable_zig/zig" >> "$GITHUB_ENV"

      - name: Stabilize Zig installation path on Windows
        if: matrix.kind == 'windows'
        shell: pwsh
        env:
          ZIG_RESTORED: ${{ steps.zig-compiler.outputs.cache-hit }}
        run: |
          $stable = Join-Path $env:RUNNER_TEMP "herdr-zig-0.16.0"
          if ($env:ZIG_RESTORED -ne "true") {
            $source = Split-Path (Get-Command zig).Source
            Move-Item -LiteralPath $source -Destination $stable
          }
          $stable | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "ZIG=$(Join-Path $stable 'zig.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Save Zig compiler
        if: steps.zig-compiler.outputs.cache-hit != 'true' && env.SAVE_CACHES == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/herdr-zig-0.16.0
          key: zig-compiler-v1-${{ runner.os }}-${{ runner.arch }}-0.16.0

      - name: Restore Zig build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-build-v1-${{ runner.os }}-${{ runner.arch }}-0.16.0-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            zig-build-v1-${{ runner.os }}-${{ runner.arch }}-0.16.0-

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          key: ${{ matrix.os }}
          save-if: ${{ env.SAVE_CACHES }}

      # Cargo still rebuilds workspace targets; only rustc's validated query state is retained.
      - name: Restore incremental compiler state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/debug/incremental
          key: ci-incremental-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN_VERSION }}-${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ env.CARGO_PROFILE_TEST_DEBUG }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'build.rs', 'crates/*/Cargo.toml', 'crates/*/build.rs') }}-${{ github.sha }}
          restore-keys: |
            ci-incremental-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN_VERSION }}-${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ env.CARGO_PROFILE_TEST_DEBUG }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'build.rs', 'crates/*/Cargo.toml', 'crates/*/build.rs') }}-

      - name: Run Linux lint
        if: runner.os == 'Linux'
        run: CARGO_INCREMENTAL=1 just lint

      - name: Run Linux tests
        if: runner.os == 'Linux'
        run: CARGO_INCREMENTAL=1 just ci-tests '${{ matrix.nextest_filter }}'

      - name: Run macOS checks
        if: runner.os == 'macOS'
        run: CARGO_INCREMENTAL=1 just ci '${{ matrix.nextest_filter }}'

      - name: Check scalar libghostty with runtime safety
        if: runner.os == 'Linux'
        env:
          LIBGHOSTTY_VT_SIMD: "false"
          LIBGHOSTTY_VT_OPTIMIZE: ReleaseSafe
        run: CARGO_INCREMENTAL=1 cargo nextest run --locked -E 'package(ghostty-vt) | test(ghostty)' --status-level fail --final-status-level fail --failure-output final --success-output never

      - name: Run Windows checks
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $env:CARGO_INCREMENTAL = "1"
          just check

      - name: Smoke ConPTY pane
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $PWD "target\debug\herdr.exe"
          .\scripts\windows_smoke_conpty_path.ps1 -ExePath $exe -Session "ci-windows-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($LASTEXITCODE -ne 0) { throw "ConPTY smoke failed ($LASTEXITCODE)" }

      - name: Replay PowerShell terminal compatibility
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\scripts\windows_tui_compat.ps1 -ExePath .\target\debug\herdr.exe -Shell powershell
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 smoke failed ($LASTEXITCODE)" }
          .\scripts\windows_tui_compat.ps1 -ExePath .\target\debug\herdr.exe -Shell pwsh
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 7 smoke failed ($LASTEXITCODE)" }

      - name: Qualify clean native release
        if: env.RELEASE_QUALIFICATION == 'true'
        shell: pwsh
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $out = 'target/ci-release-evidence'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $checkout = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $receipt = [ordered]@{ checkout_sha = $checkout; head_sha = $env:PR_HEAD_SHA; merge_sha = $env:PR_MERGE_SHA; github_sha = $env:GITHUB_SHA; runner_os = $env:RUNNER_OS; runner_arch = $env:RUNNER_ARCH; build_exit_code = $null; status = 'running' }
          $receipt.cargo_incremental = $env:CARGO_INCREMENTAL
          $receipt.cargo_incremental_source = if (Test-Path Env:CARGO_INCREMENTAL) { 'environment (pinned dtolnay/rust-toolchain sets 0)' } else { 'unset (Cargo release default)' }
          $receipt | ConvertTo-Json | Set-Content "$out/receipt.json"
          if ($checkout -ne $env:GITHUB_SHA) { throw 'Checkout does not match the workflow SHA' }
          if (Test-Path '.cargo/config.local.toml') { throw 'Local Cargo configuration is forbidden' }
          $overrides = Get-ChildItem Env: | Where-Object { $_.Name -match '^(RUSTFLAGS|CARGO_ENCODED_RUSTFLAGS|RUSTC|RUSTC_WRAPPER|RUSTC_WORKSPACE_WRAPPER|RUSTC_BOOTSTRAP|CARGO_TARGET_DIR|CARGO_BUILD_.*|CARGO_PROFILE_RELEASE_.*|CARGO_TARGET_.*_(RUSTFLAGS|LINKER|RUNNER))$' }
          if ($overrides) { throw "Build overrides are forbidden: $($overrides.Name -join ', ')" }
          if ((Test-Path Env:CARGO_INCREMENTAL) -and $env:CARGO_INCREMENTAL -cne '0') { throw 'CARGO_INCREMENTAL must be unset or exactly 0' }
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME '.cargo' }
          $configRoots = @($cargoHome)
          $parent = (Get-Item .).Parent
          while ($parent) { $configRoots += Join-Path $parent.FullName '.cargo'; $parent = $parent.Parent }
          foreach ($root in $configRoots) {
            foreach ($name in @('config', 'config.toml')) {
              if (Test-Path (Join-Path $root $name)) { throw 'Non-repository Cargo configuration is forbidden' }
            }
          }
          if (Test-Path '.cargo/config') { throw 'Legacy Cargo configuration is forbidden' }
          Copy-Item .cargo/config.toml "$out/cargo-config.toml"
          Copy-Item rust-toolchain.toml "$out/rust-toolchain.toml"
          foreach ($spec in @(@('rustc', '-vV'), @('cargo', '-V'), @('just', '--version'), @('bun', '--version'), @('zig', 'version'), @('cargo', 'nextest', '--version'))) {
            $command = $spec[0]
            [string[]]$arguments = @($spec | Select-Object -Skip 1)
            & $command @arguments 2>&1 | Tee-Object -FilePath "$out/toolchains.log" -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $env:CARGO_TERM_VERBOSE = 'true'
          just build 2>&1 | Tee-Object -FilePath "$out/build.log"
          $buildExit = $LASTEXITCODE
          $receipt.build_exit_code = $buildExit
          $receipt.status = if ($buildExit -eq 0) { 'build-complete' } else { 'build-failed' }
          $receipt | ConvertTo-Json | Set-Content "$out/receipt.json"
          if ($buildExit -ne 0) { exit $buildExit }
          New-Item -ItemType Directory -Force -Path "$out/native" | Out-Null
          if ($IsWindows) {
            Copy-Item target/release/herdr.exe "$out/native/"
            Copy-Item target/release/conpty "$out/native/conpty" -Recurse
            Copy-Item target/release/THIRD-PARTY-NOTICES "$out/native/THIRD-PARTY-NOTICES" -Recurse
          } else {
            Copy-Item target/release/herdr "$out/native/"
          }
          Get-ChildItem "$out/native" -File -Recurse | ForEach-Object {
            [ordered]@{ path = [IO.Path]::GetRelativePath((Resolve-Path $out).Path, $_.FullName); bytes = $_.Length; sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          } | ConvertTo-Json -AsArray | Set-Content "$out/artifacts.json"

      - name: Qualify macOS live handoff
        if: env.RELEASE_QUALIFICATION == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          set +e
          cargo nextest run --locked -E 'binary(live_handoff)' --status-level leak --final-status-level slow --failure-output final --success-output never 2>&1 | tee target/ci-release-evidence/live-handoff.log
          codes=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${codes[0]}" > target/ci-release-evidence/live-handoff-exit-code.txt
          if (( codes[0] != 0 )); then exit "${codes[0]}"; fi
          exit "${codes[1]}"

      - name: Prepare Unix release smoke tools
        if: env.RELEASE_QUALIFICATION == 'true' && matrix.kind == 'unix'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]] || { echo 'Disposable GitHub runner required' >&2; exit 1; }
          packages=()
          for tool in jq lsof perl tee tmux curl; do
            if ! command -v "$tool" >/dev/null; then
              if [[ "$tool" == tee ]]; then packages+=(coreutils); else packages+=("$tool"); fi
            fi
          done
          if [[ "$RUNNER_OS" == Linux ]] && ! command -v pidstat >/dev/null; then packages+=(sysstat); fi
          if (( ${#packages[@]} )); then
            if [[ "$RUNNER_OS" == Linux ]]; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends "${packages[@]}"
            else
              brew install "${packages[@]}"
            fi
          fi
          for tool in jq lsof perl tee tmux curl; do command -v "$tool"; done
          if [[ "$RUNNER_OS" == Linux ]]; then command -v pidstat; fi

      - name: Qualify Unix release performance
        id: release-perf
        if: env.RELEASE_QUALIFICATION == 'true' && matrix.kind == 'unix'
        shell: bash
        env:
          HERDR_PERF_SAMPLE_SECONDS: '60'
        run: |
          set -euo pipefail
          [[ -z "${HERDR_PERF_BASELINE_BIN+x}" ]] || { echo 'Baseline override is forbidden' >&2; exit 1; }
          shopt -s nullglob
          previous=(.local/perf-baseline/run-*)
          (( ${#previous[@]} == 0 )) || { echo 'Unexpected previous smoke evidence' >&2; exit 1; }
          set +e
          just bench-release-smoke 2>&1 | tee target/ci-release-evidence/perf.log
          codes=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${codes[0]}" > target/ci-release-evidence/perf-exit-code.txt
          runs=(.local/perf-baseline/run-*)
          if (( ${#runs[@]} == 1 )); then
            printf 'run_dir=%s\n' "${runs[0]}" >> "$GITHUB_OUTPUT"
            python3 - "${runs[0]}" <<'PY'
          import hashlib, json, pathlib, platform, sys
          run = pathlib.Path(sys.argv[1])
          manifest = pathlib.Path('distribution/latest.json')
          version = json.loads(manifest.read_text())['version']
          os_name = {'Linux': 'linux', 'Darwin': 'macos'}[platform.system()]
          arch = {'x86_64': 'x86_64', 'amd64': 'x86_64', 'arm64': 'aarch64', 'aarch64': 'aarch64'}[platform.machine().lower()]
          baseline = run / 'baseline/herdr-baseline'
          receipt = {'version': version, 'url': f'https://github.com/herdrdev/herdr/releases/download/v{version}/herdr-{os_name}-{arch}', 'manifest_sha256': hashlib.sha256(manifest.read_bytes()).hexdigest(), 'bytes': baseline.stat().st_size if baseline.exists() else None, 'sha256': hashlib.sha256(baseline.read_bytes()).hexdigest() if baseline.exists() else None}
          (run / 'baseline-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          fi
          if (( codes[0] != 0 )); then exit "${codes[0]}"; fi
          (( ${#runs[@]} == 1 )) || { echo 'Expected exactly one smoke evidence directory' >&2; exit 1; }
          exit "${codes[1]}"

      - name: Upload native release evidence
        if: always() && env.RELEASE_QUALIFICATION == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-release-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: target/ci-release-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Unix raw performance evidence
        if: always() && env.RELEASE_QUALIFICATION == 'true' && matrix.kind == 'unix' && steps.release-perf.outputs.run_dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-perf-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: |
            ${{ steps.release-perf.outputs.run_dir }}/*.txt
            ${{ steps.release-perf.outputs.run_dir }}/run.log
            ${{ steps.release-perf.outputs.run_dir }}/baseline-receipt.json
            ${{ steps.release-perf.outputs.run_dir }}/results/**/*.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      # Save before rust-cache's post-step removes incremental state.
      - name: Save incremental compiler state
        if: env.SAVE_CACHES == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/debug/incremental
          key: ci-incremental-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN_VERSION }}-${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ env.CARGO_PROFILE_TEST_DEBUG }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'build.rs', 'crates/*/Cargo.toml', 'crates/*/build.rs') }}-${{ github.sha }}

      - name: Save Zig build cache
        if: env.SAVE_CACHES == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-build-v1-${{ runner.os }}-${{ runner.arch }}-0.16.0-${{ github.run_id }}-${{ github.run_attempt }}

  windows-conpty-package:
    name: Windows ConPTY package
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Restore Zig compiler
        id: zig-compiler
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/herdr-zig-0.16.0
          key: zig-compiler-v1-${{ runner.os }}-${{ runner.arch }}-0.16.0

      - name: Install Zig
        if: steps.zig-compiler.outputs.cache-hit != 'true'
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Stabilize Zig installation path
        shell: pwsh
        env:
          ZIG_RESTORED: ${{ steps.zig-compiler.outputs.cache-hit }}
        run: |
          $stable = Join-Path $env:RUNNER_TEMP "herdr-zig-0.16.0"
          if ($env:ZIG_RESTORED -ne "true") {
            $source = Split-Path (Get-Command zig).Source
            Move-Item -LiteralPath $source -Destination $stable
          }
          $stable | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "ZIG=$(Join-Path $stable 'zig.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore Zig build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-build-v1-conpty-package-windows-2022-${{ runner.arch }}-0.16.0-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            zig-build-v1-conpty-package-windows-2022-${{ runner.arch }}-0.16.0-

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          key: conpty-package-windows-2022
          save-if: ${{ env.SAVE_CACHES }}

      - name: Build Herdr
        run: cargo build --locked --target x86_64-pc-windows-msvc

      - name: Save Zig build cache
        if: env.SAVE_CACHES == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-build-v1-conpty-package-windows-2022-${{ runner.arch }}-0.16.0-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify invalid bundle is rejected and system override recovers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceExe = Join-Path $PWD "target\x86_64-pc-windows-msvc\debug\herdr.exe"
          $probeRoot = Join-Path $PWD "target\tmp\invalid-conpty-$([guid]::NewGuid().ToString('N'))"
          $bundle = Join-Path $probeRoot "conpty"
          New-Item -ItemType Directory -Force -Path (Join-Path $bundle "x64"), (Join-Path $bundle "arm64") | Out-Null
          $exe = Join-Path $probeRoot "herdr.exe"
          Copy-Item -LiteralPath $sourceExe -Destination $exe
          Set-Content -LiteralPath (Join-Path $bundle "herdr-conpty.json") -Value "{}" -Encoding ascii
          [System.IO.File]::WriteAllBytes((Join-Path $bundle "conpty.dll"), [byte[]](0x48, 0x45, 0x52, 0x44, 0x52))
          [System.IO.File]::WriteAllBytes((Join-Path $bundle "x64\OpenConsole.exe"), [byte[]](0x48, 0x45, 0x52, 0x44, 0x52))
          [System.IO.File]::WriteAllBytes((Join-Path $bundle "arm64\OpenConsole.exe"), [byte[]](0x48, 0x45, 0x52, 0x44, 0x52))
          try {
            $invalid = .\scripts\windows_smoke_conpty_path.ps1 `
              -ExePath $exe -PassThru `
              -Session "ci-conpty-invalid-windows-2022-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            $invalidExit = $LASTEXITCODE
            $reason = "$($invalid.runtime_error)`n$($invalid.server_stderr)"
            if ($invalidExit -eq 0 -or $invalid.exit_code -ne $invalidExit -or
                $invalid.runtime -ne 'FAIL' -or $invalid.runtime_stage -ne 'workspace_create' -or
                $reason -notmatch "Herdr's app-local ConPTY bundle is invalid:" -or
                $invalid.cleanup -ne 'PASS' -or $invalid.active_processes -ne 0) {
              throw "Invalid-bundle probe did not prove the expected runtime rejection: $reason"
            }
            .\scripts\windows_smoke_conpty_path.ps1 `
              -ExePath $exe -ConptyMode system `
              -Session "ci-conpty-system-windows-2022-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            if ($LASTEXITCODE -ne 0) { throw "Explicit system ConPTY recovery failed ($LASTEXITCODE)" }
          } finally {
            Remove-Item -LiteralPath $probeRoot -Recurse -Force
          }

      - name: Build and verify official ConPTY package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $stage = Join-Path $env:RUNNER_TEMP "herdr-windows-x86_64"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          .\scripts\package_windows_conpty.ps1 `
            -HerdrExe target\x86_64-pc-windows-msvc\debug\herdr.exe `
            -PackagePath $package `
            -StageDir $stage `
            -OutputPath artifacts\herdr-windows-x86_64.zip
          "HERDR_CONPTY_PACKAGE_DIR=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Probe enhanced pane input with bundled ConPTY
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $env:HERDR_CONPTY_PACKAGE_DIR "herdr.exe"
          $consoleHost = Join-Path $env:HERDR_CONPTY_PACKAGE_DIR "conpty\x64\OpenConsole.exe"
          .\scripts\windows_conpty_enhanced_input_probe.ps1 `
            -ExePath $exe `
            -Session "ci-conpty-bundled-windows-2022-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
            -ExpectedConsoleHostPath $consoleHost

      - name: Test packaged installer and repair with Windows PowerShell 5.1
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File `
            .\scripts\windows_install_conpty_package_test.ps1 `
            -ArchivePath artifacts\herdr-windows-x86_64.zip
          if ($LASTEXITCODE -ne 0) {
            throw "Windows PowerShell installer test failed with exit code $LASTEXITCODE"
          }
